name: Build and release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout upstream ghostlock-app
        uses: actions/checkout@v4
        with:
          repository: YuKongA/ghostlock-app
          path: ghostlock-app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure required Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      
      - name: Make gradlew executable
        run: chmod +x ghostlock-app/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/ghostlock-app/**.gradle*','**/gradle-wrapper.properties') }}

      - name: Set up Rust and Android target
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source $HOME/.cargo/env
          fi
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustc --version
          cargo --version

      - name: Build APK
        env:
          JAVA_TOOL_OPTIONS: -Xmx3g
        run: |
          set -o pipefail
          cd ghostlock-app
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode=all 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ghostlock-app/build.log

      - name: Find APK
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find ghostlock-app -name "*.apk" -type f || true
          echo "=== Listing app/build/outputs ==="
          find ghostlock-app/app/build/outputs -type f 2>/dev/null || echo "no outputs dir"
          echo "=== Listing any build dirs ==="
          find ghostlock-app -type d -name "outputs" 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_id }}
          name: APK Build ${{ github.run_id }}
          files: ghostlock-app/app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
